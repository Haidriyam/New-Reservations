name: Deploy to Hosting

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy to Web Hosting via FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📂 Sync Files to Hosting Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || 'new.reserve-hotels.online' }}
          username: ${{ secrets.FTP_USERNAME || 'Admin1@new.reserve-hotels.online' }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftp
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.zip
            **/*.py
            **/New-Reservations-Export/**
